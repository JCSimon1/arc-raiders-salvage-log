name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          zip -r "arc-log-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" -x ".github/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: arc-log-${{ github.ref_name }}.zip
          generate_release_notes: true
