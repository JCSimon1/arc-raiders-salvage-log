x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    init: true
    environment:
      POSTGRES_DB: arclog
      POSTGRES_USER: arclog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arclog}
    volumes:
      - db_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arclog -d arclog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  api:
    build: ./api
    init: true
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://arclog:${POSTGRES_PASSWORD:-arclog}@db:5432/arclog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  web:
    build:
      context: ./web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    init: true
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ${IMAGE_MOUNT:-./images}:/usr/share/nginx/html/images:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  db_data:
