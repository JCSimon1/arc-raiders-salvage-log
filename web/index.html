<!DOCTYPE html>
<html lang="de" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#14171a;
    --panel:#1c2124;
    --panel-alt:#232a2e;
    --border:#333c41;
    --border-soft:#2a3236;
    --accent:#e8a33d;
    --accent-dim:#8a6428;
    --accent-2:#5c8b8f;
    --text:#e9e5dc;
    --text-muted:#8b949a;
    --text-faint:#5c6569;
    --positive:#8faa66;
    --negative:#c1503f;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,163,61,0.05), transparent),
      radial-gradient(900px 500px at 100% 0%, rgba(92,139,143,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:#fff;}

  .shell{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:18px;margin-bottom:22px;
    border-bottom:1px solid var(--border);
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand-mark{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:0.5px;color:var(--text);line-height:1;
  }
  .brand-mark span{color:var(--accent);}
  .brand-tag{font-size:12.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-faint);margin-right:6px;}
  .status-dot.ok{background:var(--positive);}
  .status-dot.err{background:var(--negative);}

  .header-right{display:flex;align-items:center;gap:22px;}
  .lang-toggle{display:flex;gap:6px;}
  .lang-toggle button{
    background:var(--panel-alt);border:1px solid var(--border);
    border-radius:var(--radius);cursor:pointer;
    width:34px;height:26px;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:.5;transition:opacity .15s ease, border-color .15s ease;
    padding:0;
  }
  .lang-toggle button:hover{opacity:.8;}
  .lang-toggle button.active{opacity:1;border-color:var(--accent-dim);}

  .header-stats{display:flex;gap:20px;}
  .stat-mini{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);
    text-align:right;letter-spacing:.2px;
  }
  .stat-mini b{
    display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;
    font-size:17px;color:var(--text);line-height:1.3;
  }
  .stat-mini b.accent{color:var(--accent);}
  .stat-mini b.teal{color:var(--accent-2);}

  nav.tabs{display:flex;gap:2px;margin-bottom:24px;border-bottom:1px solid var(--border);}
  nav.tabs button{
    background:none;border:none;color:var(--text-muted);
    font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;font-weight:500;
    padding:10px 4px;margin-right:26px;cursor:pointer;
    border-bottom:2px solid transparent;position:relative;top:1px;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .view{display:none;}
  .view.active{display:block;}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
  }
  .panel + .panel{margin-top:18px;}
  h2.panel-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;
    margin:0 0 16px;color:var(--text);letter-spacing:.2px;
  }

  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field input, .field select{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:var(--radius);
    outline:none;
    transition:border-color .15s ease;
    width:100%;
  }
  .field input::placeholder{color:var(--text-faint);font-family:'IBM Plex Sans',sans-serif;}
  .field input:focus, .field select:focus{border-color:var(--accent-2);}
  .form-actions{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:4px;}
  .btn{
    background:var(--accent);color:#1a1400;border:none;
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13.5px;
    padding:10px 18px;border-radius:var(--radius);cursor:pointer;
    transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{
    background:none;border:1px solid var(--border);color:var(--text-muted);font-weight:500;
  }
  .btn.ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .form-msg{font-size:12.5px;font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s ease;}
  .form-msg.show{opacity:1;}
  .form-msg.ok{color:var(--positive);}
  .form-msg.err{color:var(--negative);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:11px;font-weight:600;color:var(--text-faint);
    padding:0 10px 10px;border-bottom:1px solid var(--border);
    font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);font-family:'IBM Plex Mono',monospace;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:last-child td{border-bottom:none;}
  td.num{text-align:right;}
  td.money{color:var(--positive);text-align:right;}
  td.xp{color:var(--accent-2);text-align:right;}
  td.actions{text-align:right;white-space:nowrap;}
  td.actions button{
    background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;padding:2px 6px;
  }
  td.actions button:hover{color:var(--accent);}
  td.actions button.del:hover{color:var(--negative);}
  .empty-state{
    text-align:center;padding:36px 20px;color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;font-size:13px;
  }

  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-row select, .filter-row input{
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:7px 10px;border-radius:var(--radius);
  }

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;margin-bottom:8px;}
  .stat-card .value{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;color:var(--text);}
  .stat-card .value.accent{color:var(--accent);}
  .stat-card .value.teal{color:var(--accent-2);}

  .breakdown-table td, .breakdown-table th{padding:9px 10px;}
  .breakdown-table td:first-child, .breakdown-table th:first-child{font-family:'IBM Plex Sans',sans-serif;color:var(--text);}

  .chart-wrap{height:220px;margin-top:6px;}

  .sub-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .sub-tabs button{
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text-muted);
    font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:var(--radius);cursor:pointer;
  }
  .sub-tabs button.active{color:var(--accent);border-color:var(--accent-dim);}

  .analysis-block{display:none;}
  .analysis-block.active{display:block;}

  @media(max-width:720px){
    .form-grid{grid-template-columns:repeat(2,1fr);}
    .field.span-2{grid-column:span 2;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    header{flex-direction:column;align-items:flex-start;gap:10px;}
    .header-right{width:100%;justify-content:space-between;}
    .header-stats{gap:14px;}
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <div class="brand-mark">ARC <span>LOG</span></div>
      <div class="brand-tag"><span class="status-dot" id="statusDot"></span><span data-i18n="brandTag"></span></div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="langDE" title="Deutsch">DE</button>
        <button id="langEN" title="English">EN</button>
      </div>
      <div class="header-stats">
        <div class="stat-mini"><span data-i18n="headerRoundsLabel"></span><b id="runCountVal">0</b></div>
        <div class="stat-mini"><span data-i18n="headerMoneyLabel"></span><b id="totalMoneyVal" class="accent">0</b></div>
        <div class="stat-mini"><span data-i18n="headerXPLabel"></span><b id="totalXPVal" class="teal">0</b></div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="active" data-view="entry" data-i18n="navEntry"></button>
    <button data-view="list" data-i18n="navList"></button>
    <button data-view="analysis" data-i18n="navAnalysis"></button>
  </nav>

  <div class="view active" id="view-entry">
    <div class="panel">
      <h2 class="panel-title" data-i18n="entryTitle"></h2>
      <form id="roundForm" class="form-grid">
        <div class="field">
          <label for="f-number" data-i18n="labelNumber"></label>
          <input type="number" id="f-number" required>
        </div>
        <div class="field">
          <label for="f-date" data-i18n="labelDate"></label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-time" data-i18n="labelTime"></label>
          <input type="time" id="f-time" required>
        </div>
        <div class="field">
          <label for="f-map" data-i18n="labelMap"></label>
          <input list="mapOptions" id="f-map" required>
          <datalist id="mapOptions">
            <option value="Dam Battlegrounds">
            <option value="Buried City">
            <option value="Spaceport">
            <option value="Blue Gate">
            <option value="Stella Montis">
            <option value="Riven Tides">
          </datalist>
        </div>
        <div class="field">
          <label for="f-condition" data-i18n="labelCondition"></label>
          <input list="conditionOptions" id="f-condition" required>
          <datalist id="conditionOptions"></datalist>
        </div>
        <div class="field">
          <label for="f-money" data-i18n="labelMoney"></label>
          <input type="number" id="f-money" step="1" placeholder="0" required>
        </div>
        <div class="field">
          <label for="f-xp" data-i18n="labelXP"></label>
          <input type="number" id="f-xp" step="1" placeholder="0" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submitBtn" data-i18n="submitBtn"></button>
          <span class="form-msg" id="formMsg"></span>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2 class="panel-title" data-i18n="recentTitle"></h2>
      <div id="recentTableWrap"></div>
    </div>
  </div>

  <div class="view" id="view-list">
    <div class="panel">
      <h2 class="panel-title" data-i18n="listTitle"></h2>
      <div class="filter-row">
        <select id="filterMap"></select>
        <select id="filterCondition"></select>
        <input type="month" id="filterMonth">
        <button class="btn ghost" id="clearFilters" data-i18n="clearFilters"></button>
      </div>
      <div id="fullTableWrap"></div>
    </div>
  </div>

  <div class="view" id="view-analysis">
    <div class="stat-row" id="globalStats"></div>

    <div class="panel">
      <div class="sub-tabs">
        <button class="active" data-block="byMap" data-i18n="subMap"></button>
        <button data-block="byCondition" data-i18n="subCondition"></button>
        <button data-block="byMonth" data-i18n="subMonth"></button>
      </div>

      <div class="analysis-block active" id="block-byMap">
        <div class="chart-wrap"><canvas id="chartMap"></canvas></div>
        <div id="tableMap"></div>
      </div>
      <div class="analysis-block" id="block-byCondition">
        <div class="chart-wrap"><canvas id="chartCondition"></canvas></div>
        <div id="tableCondition"></div>
      </div>
      <div class="analysis-block" id="block-byMonth">
        <div class="chart-wrap"><canvas id="chartMonth"></canvas></div>
        <div id="tableMonth"></div>
      </div>
    </div>
  </div>

</div>

<script>
const API = '/api/rounds';
let rounds = [];
let charts = {};

const $ = sel => document.querySelector(sel);

// ---------- i18n ----------
const translations = {
  de: {
    brandTag: 'RUNDENTRACKER',
    navEntry: 'Erfassen', navList: 'Übersicht', navAnalysis: 'Auswertung',
    runCountLabel: 'RUNDEN GESAMT',
    headerRoundsLabel: 'RUNDEN', headerMoneyLabel: '$ GESAMT', headerXPLabel: 'XP GESAMT',
    entryTitle: 'Neue Runde eintragen',
    labelNumber: 'Nummer', labelDate: 'Datum', labelTime: 'Uhrzeit',
    labelMap: 'Map', labelCondition: 'Map Condition',
    labelMoney: '$ verdient', labelXP: 'XP erhalten',
    placeholderMap: 'z. B. Dam Battlegrounds', placeholderCondition: 'z. B. Clear, Hurricane',
    submitBtn: 'Runde speichern',
    msgSaved: 'Gespeichert.', msgSaveError: 'Fehler beim Speichern — Server erreichbar?',
    recentTitle: 'Letzte Runden', listTitle: 'Alle Runden',
    filterAllMaps: 'Alle Maps', filterAllConditions: 'Alle Conditions',
    clearFilters: 'Filter zurücksetzen',
    thNumber: 'Nr.', thDate: 'Datum', thTime: 'Zeit', thMap: 'Map', thCondition: 'Condition', thMoney: '$', thXP: 'XP',
    delete: 'Löschen',
    emptyState: 'Noch keine Runden erfasst. Trag oben deine erste Runde ein.',
    emptyAnalysis: 'Noch keine Daten für diese Auswertung.',
    statRounds: 'RUNDEN', statTotalMoney: 'GESAMT $', statTotalXP: 'GESAMT XP', statAvgMoney: 'Ø $ / RUNDE',
    subMap: 'Pro Map', subCondition: 'Pro Condition', subMonth: 'Monatlich',
    thRounds: 'Runden', thTotalMoney: 'Gesamt $', thAvgMoney: 'Ø $', thTotalXP: 'Gesamt XP', thAvgXP: 'Ø XP', thMonth: 'Monat',
    chartAvgMoney: 'Ø $ pro Runde', chartTotalMoneyMonth: 'Gesamt $ pro Monat',
    numberLocale: 'de-DE', dateLocale: 'de-DE',
    months: ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']
  },
  en: {
    brandTag: 'RUN TRACKER',
    navEntry: 'Log Run', navList: 'Overview', navAnalysis: 'Stats',
    runCountLabel: 'TOTAL RUNS',
    headerRoundsLabel: 'RUNS', headerMoneyLabel: 'TOTAL $', headerXPLabel: 'TOTAL XP',
    entryTitle: 'Log a new run',
    labelNumber: 'Number', labelDate: 'Date', labelTime: 'Time',
    labelMap: 'Map', labelCondition: 'Map Condition',
    labelMoney: '$ earned', labelXP: 'XP gained',
    placeholderMap: 'e.g. Dam Battlegrounds', placeholderCondition: 'e.g. Clear, Hurricane',
    submitBtn: 'Save run',
    msgSaved: 'Saved.', msgSaveError: 'Failed to save — is the server reachable?',
    recentTitle: 'Recent runs', listTitle: 'All runs',
    filterAllMaps: 'All maps', filterAllConditions: 'All conditions',
    clearFilters: 'Reset filters',
    thNumber: 'No.', thDate: 'Date', thTime: 'Time', thMap: 'Map', thCondition: 'Condition', thMoney: '$', thXP: 'XP',
    delete: 'Delete',
    emptyState: 'No runs logged yet. Add your first run above.',
    emptyAnalysis: 'No data yet for this breakdown.',
    statRounds: 'RUNS', statTotalMoney: 'TOTAL $', statTotalXP: 'TOTAL XP', statAvgMoney: 'AVG $ / RUN',
    subMap: 'By Map', subCondition: 'By Condition', subMonth: 'Monthly',
    thRounds: 'Runs', thTotalMoney: 'Total $', thAvgMoney: 'Avg $', thTotalXP: 'Total XP', thAvgXP: 'Avg XP', thMonth: 'Month',
    chartAvgMoney: 'Avg $ per run', chartTotalMoneyMonth: 'Total $ per month',
    numberLocale: 'en-US', dateLocale: 'en-GB',
    months: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  }
};

let currentLang = localStorage.getItem('arclog-lang') || (navigator.language.startsWith('de') ? 'de' : 'en');

function t(key){ return translations[currentLang][key]; }
function fmtMoney(n){ return '$' + Number(n).toLocaleString(t('numberLocale')); }
function fmtXP(n){ return Number(n).toLocaleString(t('numberLocale')); }
function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(Date.UTC(Number(y), Number(m)-1, Number(d)));
  return dt.toLocaleDateString(t('dateLocale'), { timeZone:'UTC' });
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  $('#f-map').placeholder = t('placeholderMap');
  $('#f-condition').placeholder = t('placeholderCondition');
  document.documentElement.lang = currentLang;
  $('#langDE').classList.toggle('active', currentLang==='de');
  $('#langEN').classList.toggle('active', currentLang==='en');
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('arclog-lang', lang);
  applyStaticTranslations();
  populateFilterOptions();
  refreshAll();
}
$('#langDE').addEventListener('click', ()=>setLang('de'));
$('#langEN').addEventListener('click', ()=>setLang('en'));

function setStatus(state){
  const dot = $('#statusDot');
  dot.classList.remove('ok','err');
  if(state) dot.classList.add(state);
}

// ---------- API ----------
async function loadRounds(){
  const res = await fetch(API);
  if(!res.ok) throw new Error('load failed');
  rounds = await res.json();
}
async function createRound(entry){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      round_number: entry.number,
      round_date: entry.date,
      round_time: entry.time,
      map: entry.map,
      map_condition: entry.condition,
      money: entry.money,
      xp: entry.xp
    })
  });
  if(!res.ok) throw new Error('save failed');
  return res.json();
}
async function deleteRound(id){
  const res = await fetch(API + '/' + id, { method: 'DELETE' });
  if(!res.ok) throw new Error('delete failed');
}

// ---------- Tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    $('#view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='analysis') renderAnalysis();
    if(btn.dataset.view==='list') renderFullTable();
  });
});
document.querySelectorAll('.sub-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.sub-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.analysis-block').forEach(b=>b.classList.remove('active'));
    $('#block-'+btn.dataset.block).classList.add('active');
  });
});

// ---------- Form ----------
const form = $('#roundForm');
function nextNumber(){
  if(rounds.length===0) return 1;
  return Math.max(...rounds.map(r=>Number(r.number)||0)) + 1;
}
function prefillForm(){
  $('#f-number').value = nextNumber();
  const now = new Date();
  $('#f-date').value = now.toISOString().slice(0,10);
  $('#f-time').value = now.toTimeString().slice(0,5);
}

function showMsg(text, kind){
  const msg = $('#formMsg');
  msg.textContent = text;
  msg.classList.remove('ok','err');
  msg.classList.add(kind, 'show');
  setTimeout(()=>msg.classList.remove('show'), 2200);
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const submitBtn = $('#submitBtn');
  submitBtn.disabled = true;
  const entry = {
    number: Number($('#f-number').value),
    date: $('#f-date').value,
    time: $('#f-time').value,
    map: $('#f-map').value.trim(),
    condition: $('#f-condition').value.trim(),
    money: Number($('#f-money').value),
    xp: Number($('#f-xp').value)
  };
  try{
    await createRound(entry);
    await loadRounds();
    form.reset();
    prefillForm();
    $('#f-money').value='';
    $('#f-xp').value='';
    showMsg(t('msgSaved'), 'ok');
    setStatus('ok');
    refreshAll();
  }catch(err){
    showMsg(t('msgSaveError'), 'err');
    setStatus('err');
  }finally{
    submitBtn.disabled = false;
  }
});

// ---------- Rendering: tables ----------
function sortedRounds(list){
  return [...list].sort((a,b)=>{
    const da = a.date+ 'T'+(a.time||'00:00');
    const db = b.date+ 'T'+(b.time||'00:00');
    if(da!==db) return db.localeCompare(da);
    return (b.number||0)-(a.number||0);
  });
}

function tableHTML(list, opts){
  opts = opts || {};
  const editable = opts.editable !== false;
  if(list.length===0){
    return '<div class="empty-state">' + t('emptyState') + '</div>';
  }
  const rows = list.map(r=>`
    <tr>
      <td>${r.number}</td>
      <td>${formatDate(r.date)}</td>
      <td>${r.time||''}</td>
      <td>${escapeHTML(r.map)}</td>
      <td>${escapeHTML(r.condition)}</td>
      <td class="money">${fmtMoney(r.money)}</td>
      <td class="xp">${fmtXP(r.xp)}</td>
      ${editable? `<td class="actions"><button class="del" data-id="${r.id}">${t('delete')}</button></td>`:''}
    </tr>
  `).join('');
  return `
    <table>
      <thead><tr>
        <th>${t('thNumber')}</th><th>${t('thDate')}</th><th>${t('thTime')}</th><th>${t('thMap')}</th><th>${t('thCondition')}</th><th>${t('thMoney')}</th><th>${t('thXP')}</th>${editable?'<th></th>':''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderRecentTable(){
  const recent = sortedRounds(rounds).slice(0,6);
  $('#recentTableWrap').innerHTML = tableHTML(recent);
  bindDeleteButtons('#recentTableWrap');
}

function renderFullTable(){
  populateFilterOptions();
  const mapF = $('#filterMap').value;
  const condF = $('#filterCondition').value;
  const monthF = $('#filterMonth').value;
  let list = rounds.filter(r=>{
    if(mapF && r.map!==mapF) return false;
    if(condF && r.condition!==condF) return false;
    if(monthF && r.date && r.date.slice(0,7)!==monthF) return false;
    return true;
  });
  $('#fullTableWrap').innerHTML = tableHTML(sortedRounds(list));
  bindDeleteButtons('#fullTableWrap');
}

function populateFilterOptions(){
  const maps = [...new Set(rounds.map(r=>r.map).filter(Boolean))].sort();
  const conds = [...new Set(rounds.map(r=>r.condition).filter(Boolean))].sort();
  const fm = $('#filterMap'), fc = $('#filterCondition');
  const curM = fm.value, curC = fc.value;
  fm.innerHTML = `<option value="">${t('filterAllMaps')}</option>` + maps.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');
  fc.innerHTML = `<option value="">${t('filterAllConditions')}</option>` + conds.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');
  fm.value = curM; fc.value = curC;
}

function bindDeleteButtons(scopeSel){
  document.querySelectorAll(scopeSel+' .del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await deleteRound(btn.dataset.id);
        await loadRounds();
        setStatus('ok');
        refreshAll();
      }catch(err){
        setStatus('err');
      }
    });
  });
}

$('#filterMap').addEventListener('change', renderFullTable);
$('#filterCondition').addEventListener('change', renderFullTable);
$('#filterMonth').addEventListener('change', renderFullTable);
$('#clearFilters').addEventListener('click', ()=>{
  $('#filterMap').value=''; $('#filterCondition').value=''; $('#filterMonth').value='';
  renderFullTable();
});

// ---------- Analysis ----------
function groupBy(list, keyFn){
  const map = new Map();
  list.forEach(r=>{
    const k = keyFn(r);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}
function statsFor(list){
  const count = list.length;
  const totalMoney = list.reduce((s,r)=>s+(Number(r.money)||0),0);
  const totalXP = list.reduce((s,r)=>s+(Number(r.xp)||0),0);
  return {
    count, totalMoney, totalXP,
    avgMoney: count? totalMoney/count : 0,
    avgXP: count? totalXP/count : 0
  };
}

function renderAnalysis(){
  renderGlobalStats();
  renderBreakdown('map', 'tableMap', 'chartMap');
  renderBreakdown('condition', 'tableCondition', 'chartCondition');
  renderMonthlyBreakdown();
}

function renderGlobalStats(){
  const s = statsFor(rounds);
  $('#globalStats').innerHTML = `
    <div class="stat-card"><div class="label">${t('statRounds')}</div><div class="value">${s.count}</div></div>
    <div class="stat-card"><div class="label">${t('statTotalMoney')}</div><div class="value accent">${fmtMoney(s.totalMoney)}</div></div>
    <div class="stat-card"><div class="label">${t('statTotalXP')}</div><div class="value teal">${fmtXP(s.totalXP)}</div></div>
    <div class="stat-card"><div class="label">${t('statAvgMoney')}</div><div class="value">${fmtMoney(Math.round(s.avgMoney))}</div></div>
  `;
}

function renderBreakdown(field, tableId, chartId){
  const groups = groupBy(rounds, r=>r[field]||'—');
  const entries = [...groups.entries()].map(([key, list])=>({key, ...statsFor(list)}));
  entries.sort((a,b)=>b.totalMoney-a.totalMoney);

  const wrap = document.getElementById(tableId);
  if(entries.length===0){
    wrap.innerHTML = '<div class="empty-state">' + t('emptyAnalysis') + '</div>';
  } else {
    wrap.innerHTML = `
      <table class="breakdown-table">
        <thead><tr>
          <th>${field==='map'?t('thMap'):t('thCondition')}</th><th>${t('thRounds')}</th><th>${t('thTotalMoney')}</th><th>${t('thAvgMoney')}</th><th>${t('thTotalXP')}</th><th>${t('thAvgXP')}</th>
        </tr></thead>
        <tbody>
          ${entries.map(e=>`
            <tr>
              <td>${escapeHTML(e.key)}</td>
              <td>${e.count}</td>
              <td class="money" style="text-align:left">${fmtMoney(e.totalMoney)}</td>
              <td class="money" style="text-align:left">${fmtMoney(Math.round(e.avgMoney))}</td>
              <td class="xp" style="text-align:left">${fmtXP(e.totalXP)}</td>
              <td class="xp" style="text-align:left">${fmtXP(Math.round(e.avgXP))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }
  drawBarChart(chartId, entries.map(e=>e.key), entries.map(e=>Math.round(e.avgMoney)), t('chartAvgMoney'));
}

function renderMonthlyBreakdown(){
  const groups = groupBy(rounds.filter(r=>r.date), r=>r.date.slice(0,7));
  const entries = [...groups.entries()].map(([key, list])=>({key, ...statsFor(list)}));
  entries.sort((a,b)=>a.key.localeCompare(b.key));

  const wrap = document.getElementById('tableMonth');
  if(entries.length===0){
    wrap.innerHTML = '<div class="empty-state">' + t('emptyAnalysis') + '</div>';
  } else {
    wrap.innerHTML = `
      <table class="breakdown-table">
        <thead><tr>
          <th>${t('thMonth')}</th><th>${t('thRounds')}</th><th>${t('thTotalMoney')}</th><th>${t('thAvgMoney')}</th><th>${t('thTotalXP')}</th><th>${t('thAvgXP')}</th>
        </tr></thead>
        <tbody>
          ${entries.slice().reverse().map(e=>`
            <tr>
              <td>${formatMonth(e.key)}</td>
              <td>${e.count}</td>
              <td class="money" style="text-align:left">${fmtMoney(e.totalMoney)}</td>
              <td class="money" style="text-align:left">${fmtMoney(Math.round(e.avgMoney))}</td>
              <td class="xp" style="text-align:left">${fmtXP(e.totalXP)}</td>
              <td class="xp" style="text-align:left">${fmtXP(Math.round(e.avgXP))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }
  drawBarChart('chartMonth', entries.map(e=>formatMonth(e.key)), entries.map(e=>e.totalMoney), t('chartTotalMoneyMonth'));
}
function formatMonth(ym){
  const [y,m] = ym.split('-');
  return t('months')[Number(m)-1] + ' ' + y;
}

function drawBarChart(canvasId, labels, data, label){
  const ctx = document.getElementById(canvasId);
  if(charts[canvasId]) charts[canvasId].destroy();
  if(labels.length===0) return;
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label,
        data,
        backgroundColor: 'rgba(232,163,61,0.55)',
        borderColor: 'rgba(232,163,61,0.9)',
        borderWidth: 1,
        borderRadius: 2,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display:false } },
      scales: {
        x: { ticks: { color:'#8b949a', font:{family:'IBM Plex Mono', size:11} }, grid: { color:'rgba(255,255,255,0.04)' } },
        y: { ticks: { color:'#8b949a', font:{family:'IBM Plex Mono', size:11} }, grid: { color:'rgba(255,255,255,0.06)' } }
      }
    }
  });
}

// ---------- Global refresh ----------
function updateDatalists(){
  const conds = [...new Set(rounds.map(r=>r.condition).filter(Boolean))].sort();
  $('#conditionOptions').innerHTML = conds.map(c=>`<option value="${escapeHTML(c)}">`).join('');
}

function refreshAll(){
  const s = statsFor(rounds);
  $('#runCountVal').textContent = s.count;
  $('#totalMoneyVal').textContent = fmtMoney(s.totalMoney);
  $('#totalXPVal').textContent = fmtXP(s.totalXP);
  renderRecentTable();
  updateDatalists();
  if($('#view-list').classList.contains('active')) renderFullTable();
  if($('#view-analysis').classList.contains('active')) renderAnalysis();
}

// ---------- Init ----------
(async function init(){
  applyStaticTranslations();
  populateFilterOptions();
  prefillForm();
  try{
    await loadRounds();
    setStatus('ok');
  }catch(err){
    setStatus('err');
  }
  refreshAll();
})();
</script>
</body>
</html>
