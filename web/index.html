<!DOCTYPE html>
<html lang="de" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Raiders Salvage Log</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>
<div class="shell">

  <header>

  <div class="profile-bar">

      </div>
      <img class="profile-card-icon is-empty" id="rankCardIcon" alt="" onerror="this.classList.add('is-empty')">

    <div class="profile-card hidden" id="steamCard">

  <nav class="tabs">

    <button data-view="loot" data-i18n="navLoot"></button>

  <div class="view active" id="view-entry">
    <div class="panel">

        <div class="field">
          <label for="f-number" data-i18n="labelNumber"></label>
          <input type="number" id="f-number" required>
        </div>

          <label for="f-date" data-i18n="labelDate"></label>

        </div>
        <div class="field">
          <label for="f-time" data-i18n="labelTime"></label>
          <input type="time" id="f-time" required>
        </div>
        <div class="field">
          <label for="f-map" data-i18n="labelMap"></label>

            <option value="Spaceport">

        <div class="field">

          <input type="number" id="f-money" step="1" placeholder="0" required>
        </div>
        <div class="field">
          <label for="f-xp" data-i18n="labelXP"></label>
          <input type="number" id="f-xp" step="1" placeholder="0" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submitBtn" data-i18n="submitBtn"></button>
          <button type="button" class="btn ghost hidden" id="cancelEditBtn" data-i18n="cancelEdit"></button>

        </div>
      </form>
    </div>

    <div class="panel">
      <h2 class="panel-title" data-i18n="recentTitle"></h2>
      <div id="recentTableWrap"></div>
    </div>
  </div>

  <div class="view" id="view-list">
    <div class="panel">
      <h2 class="panel-title" data-i18n="listTitle"></h2>
      <div class="filter-row">
        <select id="filterMap"></select>
        <select id="filterCondition"></select>
        <input type="month" id="filterMonth">
        <button class="btn ghost" id="clearFilters" data-i18n="clearFilters"></button>
      </div>
      <div id="fullTableWrap"></div>
      <div class="pagination" id="listPagination"></div>
    </div>
  </div>

  <div class="view" id="view-analysis">
    <div class="stat-row" id="globalStats"></div>
    <div class="panel">
      <h2 class="panel-title" data-i18n="highscoreTitle"></h2>
      <div class="highscore-grid">
        <div class="highscore-card">
          <div class="hs-label">
            <span data-i18n="hsMoneyLabel"></span>
            <svg class="hs-icon hs-icon-money" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M12 2 21 6.5v6c0 5-4 8.5-9 9.5-5-1-9-4.5-9-9.5v-6z" stroke-linejoin="round"/>
              <path d="M12 8v8M9.8 9.6c0-1 1-1.6 2.2-1.6s2.2.7 2.2 1.6-1 1.4-2.2 1.4-2.2.6-2.2 1.6 1 1.6 2.2 1.6 2.2-.6 2.2-1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="hs-value accent" id="hsMoneyValue">—</div>
          <div class="hs-details" id="hsMoneyDetails"></div>
          <button class="hs-toggle" data-metric="money"></button>
          <div class="hs-list" id="hsMoneyList"></div>
        </div>
        <div class="highscore-card">
          <div class="hs-label">
            <span data-i18n="hsXPLabel"></span>
              <svg class="hs-icon hs-icon-xp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M12 2 21 7v10l-9 5-9-5V7z" stroke-linejoin="round"/>
                <path d="M13 7 8 13h4l-1 5 6-7h-4z" fill="currentColor" stroke="none"/>
              </svg>
          </div>
          <div class="hs-value teal" id="hsXPValue">—</div>
          <div class="hs-details" id="hsXPDetails"></div>
          <button class="hs-toggle" data-metric="xp"></button>
          <div class="hs-list" id="hsXPList"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="sub-tabs">
        <button class="active" data-block="byMap" data-i18n="subMap"></button>
        <button data-block="byCondition" data-i18n="subCondition"></button>
        <button data-block="byMonth" data-i18n="subMonth"></button>
      </div>

      <div class="analysis-block active" id="block-byMap">
        <div class="chart-wrap"><canvas id="chartMap"></canvas></div>
        <div id="tableMap"></div>
      </div>
      <div class="analysis-block" id="block-byCondition">
        <div class="chart-wrap"><canvas id="chartCondition"></canvas></div>
        <div id="tableCondition"></div>
      </div>
      <div class="analysis-block" id="block-byMonth">
        <div class="chart-wrap"><canvas id="chartMonth"></canvas></div>
        <div id="tableMonth"></div>
      </div>
    </div>
  </div>

  <div class="view" id="view-distribution">
    <div class="highscore-grid">
      <div class="highscore-card">
        <div class="hs-label"><span data-i18n="distMapTitle"></span></div>
        <div class="chart-wrap"><canvas id="chartMapDist"></canvas></div>
        <div id="tableMapDist"></div>
      </div>
      <div class="highscore-card">
        <div class="hs-label"><span data-i18n="distConditionTitle"></span></div>
        <div class="chart-wrap"><canvas id="chartConditionDist"></canvas></div>
        <div id="tableConditionDist"></div>
      </div>
    </div>
  </div>

  <div class="view" id="view-loot">
    <div class="panel">
      <div class="loot-total-card">
        <div class="loot-total-label" data-i18n="lootTotalLabel"></div>
        <div class="loot-total-value" id="lootTotalValue">—</div>
      </div>
    </div>
    <div class="panel">
      <h2 class="panel-title" data-i18n="lootTitle"></h2>
      <div id="lootTableWrap"></div>
      <span class="form-msg" id="lootMsg"></span>
    </div>
  </div>

  <div class="view" id="view-settings">
    <div class="panel">
      <h2 class="panel-title" data-i18n="settingsLanguageTitle"></h2>
      <div class="lang-toggle">
        <button id="langDE" title="Deutsch">DE</button>
        <button id="langEN" title="English">EN</button>
      </div>
    </div>
    <div class="panel">
      <h2 class="panel-title" data-i18n="settingsRankTitle"></h2>
      <div class="settings-rank-row">
        <img class="rank-logo-preview is-empty" id="rankPreviewImg" alt="" onerror="this.classList.add('is-empty')">
        <select id="rankSelect"></select>
      </div>
    </div>
  </div>

  <div class="ticker-wrap">
    <div class="ticker-label" data-i18n="tickerLabel"></div>
      <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>
  <footer class="app-footer">v<span id="appVersion">%%VERSION%%</span></footer>
</div>

<!-- Round Report card: opens when a round row is clicked -->
<div class="rc-overlay" id="rcOverlay">
  <div class="rc-card" id="rcCard">
    <div class="rc-corner-tl"></div><div class="rc-corner-tr"></div><div class="rc-corner-bl"></div><div class="rc-corner-br"></div>
    <button class="rc-close" id="rcCloseBtn" data-i18n="rcClose"></button>

    <div class="rc-banner">
      <img class="rc-banner-img" id="rcBannerImg" alt="" onerror="this.style.display='none'">

      <div class="rc-map-name" id="rcMapName">—</div>
      <div class="rc-condition-badge" id="rcConditionBadge">
        <img id="rcConditionBadgeImg" alt="" onerror="this.closest('.rc-condition-badge').style.display='none'">
      </div>
    </div>

    <div class="rc-inner">
      <div class="rc-meta-row">
        <span data-i18n="rcEyebrow"></span>
        <span id="rcTimestamp">—</span>
      </div>
      <div class="rc-stamp" id="rcStamp" data-i18n="rcTopRun"></div>

      <div class="rc-body">
        <div class="rc-scan-mask"></div>
        <div class="rc-scanline"></div>

        <div class="rc-row"><span class="rc-k" data-i18n="rcCondition"></span><span class="rc-v" id="rcConditionValue">—</span></div>
        <div class="rc-row"><span class="rc-k" data-i18n="rcMoney"></span><span class="rc-v money" id="rcMoney">0</span></div>
        <div class="rc-row"><span class="rc-k" data-i18n="rcXP"></span><span class="rc-v xp" id="rcXP">0</span></div>

        <div class="rc-deltas">
          <div class="rc-delta" id="rcDeltaMoney"></div>

        </div>
      </div>
    </div>

    <div class="rc-footer">
      <button class="btn ghost" id="rcEditBtn" data-i18n="rcEditBtn"></button>
      <button class="btn primary" id="rcOkBtn" data-i18n="rcArchiveBtn"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>							   
<script>
const API = '/api/rounds';
const LOOT_API = '/api/loot';
const SETTINGS_API = '/api/settings';
let rounds = [];
let loot = [];
let charts = {};
let editingId = null;
let lootSaveTimers = {};
let listPage = 1;
const LIST_PAGE_SIZE = 20;
let rankCatalog = [];
let currentRank = null;
let rcCurrentRound = null;

const $ = sel => document.querySelector(sel);
const COMPANY_LOGOS = [
  'J_Kozma_Ventures_Logo.webp',
  'Armata_Logo.webp',
  'Arqzian_Logo.webp',
  'Astraventuro_Logo.webp',
  'Avantale_Circular_Logo.webp',
  'Avantale_Logo.webp',
  'Convinio_Logo.webp',
  'Enelica_Logo.webp',
  'Erma_Cora_Logo.webp',
  'Galleria_Soldanella_Logo.webp',
  'Guardia_Logo.webp',
  'Istituto_Alessia_Pavanelli_Logo.webp',
  'J_Kozma_Ventures_Logo.webp',
  'Jiangsu_Romagna_Logo.webp',
  'Lanza_Logo.webp',
  'Lotto_Logo.webp',
  'Mantikor_Logo.webp',
  'Milae_Analyz_Logo.webp',
  'Nexafuel_Logo.webp',
  'Popet_Logo.webp',
  'Rojalid_Logo.webp',
  'Saetta_Logo.webp',
  'Sogoslanda_Logo.webp',
  'Stella_Montis_Logo.webp',
  'Su_Durante_Logo.webp',
  'Supracosta_Logo.webp',
  'Tanoo_Logo.webp',
  'Vigorosa_Logo.webp'
];

let currentLang = localStorage.getItem('arclog-lang') || (navigator.language.startsWith('de') ? 'de' : 'en');

function t(key){ return translations[currentLang][key]; }
function fmtMoney(n){ return '$' + Number(n).toLocaleString(t('numberLocale')); }
function fmtXP(n){ return Number(n).toLocaleString(t('numberLocale')); }
function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(Date.UTC(Number(y), Number(m)-1, Number(d)));
  return dt.toLocaleDateString(t('dateLocale'), { timeZone:'UTC' });
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  $('#f-map').placeholder = t('placeholderMap');
  $('#f-condition').placeholder = t('placeholderCondition');
  document.documentElement.lang = currentLang;
  $('#langDE').classList.toggle('active', currentLang==='de');
  $('#langEN').classList.toggle('active', currentLang==='en');
  // Entry-Panel-Titel und Submit-Button hängen vom Bearbeitungs-Modus ab,
  // die generische data-i18n-Schleife oben setzt sie erstmal auf den Default zurück.
  $('#entryPanelTitle').textContent = editingId ? t('editTitle') : t('entryTitle');
  $('#submitBtn').textContent = editingId ? t('updateBtn') : t('submitBtn');
  updateHsToggleLabels();
  updateRankSelectPlaceholder();
  updateRankCard();
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('arclog-lang', lang);
  applyStaticTranslations();
  populateFilterOptions();
  refreshAll();
  if(lastSteamData) showSteamCard(lastSteamData);
  if(rcCurrentRound) openRoundCard(rcCurrentRound, { skipAnimation:true });
}
$('#langDE').addEventListener('click', ()=>setLang('de'));
$('#langEN').addEventListener('click', ()=>setLang('en'));

function setStatus(state){
  const dot = $('#statusDot');
  dot.classList.remove('ok','err');
  if(state) dot.classList.add(state);
}

// ---------- Logo ticker / marquee ----------
function companyDisplayName(filename){
  return filename
    .replace(/\.webp$/i, '')
    .replace(/_Logo$/i, '')
    .replace(/_/g, ' ');
}

function renderTicker(){
  const track = $('#tickerTrack');
  if(!track || COMPANY_LOGOS.length === 0) return;
  const itemHTML = COMPANY_LOGOS.map(file => `
    <img src="/images/companies/${file}" alt="${escapeHTML(companyDisplayName(file))}"
         title="${escapeHTML(companyDisplayName(file))}" loading="lazy" onerror="this.remove()">
  `).join('');
  // zweimal rendern für nahtlosen Loop
  track.innerHTML = itemHTML + itemHTML;
}

// ---------- API ----------
async function loadRounds(){
  const res = await fetch(API);
  if(!res.ok) throw new Error('load failed');
  rounds = await res.json();
}
async function createRound(entry){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      round_number: entry.number,
      round_date: entry.date,
      round_time: entry.time,
      map: entry.map,
      map_condition: entry.condition,
      money: entry.money,
      xp: entry.xp
    })
  });
  if(!res.ok) throw new Error('save failed');
  return res.json();
}
async function updateRound(id, entry){
  const res = await fetch(API + '/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      round_number: entry.number,
      round_date: entry.date,
      round_time: entry.time,
      map: entry.map,
      map_condition: entry.condition,
      money: entry.money,
      xp: entry.xp
    })
  });
  if(!res.ok) throw new Error('update failed');
  return res.json();
}
async function deleteRound(id){
  const res = await fetch(API + '/' + id, { method: 'DELETE' });
  if(!res.ok) throw new Error('delete failed');
}

// ---------- Loot API ----------
async function loadLoot(){
  const res = await fetch(LOOT_API);
  if(!res.ok) throw new Error('loot load failed');
  loot = await res.json();
}
async function saveLootAmount(key, amount){
  const res = await fetch(LOOT_API + '/' + encodeURIComponent(key), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount })
  });
  if(!res.ok) throw new Error('loot save failed');
  return res.json();
}

// ---------- Settings / Profil (Rang) ----------
function rankImgSrc(key){ return '/images/ranks/' + key + '.webp'; }

async function loadSettings(){
  const res = await fetch(SETTINGS_API);
  if(!res.ok) throw new Error('settings load failed');
  const data = await res.json();
  rankCatalog = data.ranks || [];
  currentRank = data.rank || null;
}

async function saveRank(rank){
  const res = await fetch(SETTINGS_API + '/rank', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rank: rank || null })
  });
  if(!res.ok) throw new Error('rank save failed');
  return res.json();
}

function updateRankSelectPlaceholder(){
  const placeholderOpt = $('#rankSelect') && $('#rankSelect').querySelector('option[value=""]');
  if(placeholderOpt) placeholderOpt.textContent = t('profileRankPlaceholder');
}

function populateRankSelect(){
  const select = $('#rankSelect');
  if(!select) return;
  select.innerHTML = `<option value="">${t('profileRankPlaceholder')}</option>` +
    rankCatalog.map(r => `<option value="${escapeHTML(r.key)}">${escapeHTML(r.name)}</option>`).join('');
  select.value = currentRank || '';
}

function rankName(key){
  const found = rankCatalog.find(r => r.key === key);
  return found ? found.name : null;
}

function updateRankLogo(){
  const img = $('#rankPreviewImg');
  if(img){
    if(currentRank){
      img.classList.remove('is-empty');
      img.src = rankImgSrc(currentRank);
    } else {
      img.classList.add('is-empty');
      img.removeAttribute('src');
    }
  }
  updateRankCard();
}

function updateRankCard(){
  const icon = $('#rankCardIcon');
  const value = $('#rankCardValue');
  if(!icon || !value) return;
  if(currentRank){
    icon.classList.remove('is-empty');
    icon.src = rankImgSrc(currentRank);
    value.textContent = rankName(currentRank) || currentRank;
  } else {
    icon.classList.add('is-empty');
    icon.removeAttribute('src');
    value.textContent = t('profileRankNone');
  }
}

function renderProfile(){
  populateRankSelect();
  updateRankLogo();
}

$('#rankSelect') && $('#rankSelect').addEventListener('change', async e=>{
  const newRank = e.target.value || null;
  const previous = currentRank;
  currentRank = newRank;
  updateRankLogo();
  try{
    await saveRank(newRank);
    setStatus('ok');
  }catch(err){
    currentRank = previous;
    populateRankSelect();
    updateRankLogo();
    setStatus('err');
  }
});

// ---------- Steam-Profil ----------
const STEAM_STATUS_CLASSES = [
  'steam-online','steam-busy','steam-away','steam-snooze',
  'steam-looking_to_trade','steam-looking_to_play','steam-offline'
];

let lastSteamData = null;

function hideSteamCard(){
  const card = $('#steamCard');
  if(card) card.classList.add('hidden');
}

function showSteamCard(data){
  lastSteamData = data;
  const card = $('#steamCard');
  if(!card) return;
  card.classList.remove('hidden');

  $('#steamName').textContent = data.name || '—';

  const avatar = $('#steamAvatar');
  if(avatar){
    if(data.avatar){
      avatar.src = data.avatar;
      avatar.classList.remove('is-empty');
    } else {
      avatar.classList.add('is-empty');
      avatar.removeAttribute('src');
    }
  }

  const dot = $('#steamStatusDot');
  const text = $('#steamStatusText');
  const statusRow = $('#steamStatusRow');
  const status = data.status || 'offline';
  if(dot && text && statusRow){
    STEAM_STATUS_CLASSES.forEach(c=>dot.classList.remove(c));
    dot.classList.add('steam-' + status);
    text.textContent = t('steamStatus_' + status) || status;
    statusRow.classList.remove('hidden');
  }
}

async function loadSteamProfile(){
  try{
    const res = await fetch('/api/steam/profile');
    if(!res.ok){ hideSteamCard(); return; }
    const data = await res.json();
    if(!data.configured || data.error){ hideSteamCard(); return; }
    showSteamCard(data);
  }catch(err){
    hideSteamCard();
  }
}

// ---------- Tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    $('#view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='analysis') renderAnalysis();
    if(btn.dataset.view==='list') renderFullTable();

}
function prefillForm(){
  $('#f-number').value = nextNumber();

  $('#f-date').value = now.toISOString().slice(0,10);
  $('#f-time').value = now.toTimeString().slice(0,5);

function showMsg(text, kind){

function enterEditMode(round){
  editingId = round.id;
  $('#f-number').value = round.number;
  $('#f-date').value = round.date;
  $('#f-time').value = round.time;
  $('#f-map').value = round.map;

  $('#view-entry').classList.add('active');

  $('#roundForm').scrollIntoView({ behavior:'smooth', block:'start' });

function exitEditMode(){
  editingId = null;
  form.reset();
  prefillForm();
  $('#f-money').value='';
  $('#f-xp').value='';
  $('#entryPanelTitle').textContent = t('entryTitle');

$('#cancelEditBtn').addEventListener('click', ()=>{
  exitEditMode();
});

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const submitBtn = $('#submitBtn');
  submitBtn.disabled = true;
  const isEditing = !!editingId;
  const entry = {
    number: Number($('#f-number').value),
    date: $('#f-date').value,
    time: $('#f-time').value,
    map: $('#f-map').value.trim(),
    condition: $('#f-condition').value.trim(),
    money: Number($('#f-money').value),
    xp: Number($('#f-xp').value)
  };
  try{
    if(isEditing){
      await updateRound(editingId, entry);
    } else {
      await createRound(entry);
    }
    await loadRounds();
    exitEditMode();
    showMsg(isEditing ? t('msgUpdated') : t('msgSaved'), 'ok');
    setStatus('ok');
    refreshAll();
  }catch(err){
    showMsg(isEditing ? t('msgUpdateError') : t('msgSaveError'), 'err');
    setStatus('err');
  }finally{
    submitBtn.disabled = false;
  }
});

// ---------- Rendering: tables ----------
function sortedRounds(list){
  return [...list].sort((a,b)=>{
    const da = a.date+ 'T'+(a.time||'00:00');
    const db = b.date+ 'T'+(b.time||'00:00');
    if(da!==db) return db.localeCompare(da);
    return (b.number||0)-(a.number||0);
  });
}

function tableHTML(list, opts){
  opts = opts || {};
  const editable = opts.editable !== false;
  if(list.length===0){
    return '<div class="empty-state">' + t('emptyState') + '</div>';
  }
  const rows = list.map(r=>`
    <tr data-id="${r.id}" class="rc-row-trigger">
      <td>${r.number}</td>
      <td>${formatDate(r.date)}</td>
      <td>${r.time||''}</td>
      <td><div class="cell-with-icon"><img class="map-thumb" src="${mapImgSrc(r.map)}" alt="" loading="lazy" onerror="this.remove()">${escapeHTML(r.map)}</div></td>
      <td><div class="cell-with-icon"><img class="condition-thumb" src="${conditionImgSrc(r.condition)}" alt="" loading="lazy" onerror="this.remove()">${escapeHTML(r.condition)}</div></td>
      <td class="money">${fmtMoney(r.money)}</td>
      <td class="xp">${fmtXP(r.xp)}</td>
      ${editable? `<td class="actions"><button class="edit" data-id="${r.id}">${t('edit')}</button><button class="del" data-id="${r.id}">${t('delete')}</button></td>`:''}
    </tr>
  `).join('');
  return `
    <table>
      <thead><tr>
        <th>${t('thNumber')}</th><th>${t('thDate')}</th><th>${t('thTime')}</th><th>${t('thMap')}</th><th>${t('thCondition')}</th><th>${t('thMoney')}</th><th>${t('thXP')}</th>${editable?'<th></th>':''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderRecentTable(){
  const recent = sortedRounds(rounds).slice(0,6);
  $('#recentTableWrap').innerHTML = tableHTML(recent);
  bindEditButtons('#recentTableWrap');
  bindDeleteButtons('#recentTableWrap');
}

function slugify(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') 
    .replace(/[^a-z0-9]/g, '');
}
function mapImgSrc(map){ return '/images/maps/' + slugify(map) + '.webp'; }
function conditionImgSrc(cond){ return '/images/conditions/' + slugify(cond) + '.webp'; }
function lootImgSrc(key){ return '/images/loot/' + key + '.webp'; }

function renderFullTable(){
  populateFilterOptions();
  const mapF = $('#filterMap').value;
  const condF = $('#filterCondition').value;
  const monthF = $('#filterMonth').value;
  let list = rounds.filter(r=>{
    if(mapF && r.map!==mapF) return false;
    if(condF && r.condition!==condF) return false;
    if(monthF && r.date && r.date.slice(0,7)!==monthF) return false;
    return true;
  });
  list = sortedRounds(list);

  const totalPages = Math.max(1, Math.ceil(list.length / LIST_PAGE_SIZE));
  if(listPage > totalPages) listPage = totalPages;
  if(listPage < 1) listPage = 1;
  const start = (listPage - 1) * LIST_PAGE_SIZE;
  const pageItems = list.slice(start, start + LIST_PAGE_SIZE);

  $('#fullTableWrap').innerHTML = tableHTML(pageItems);
  bindEditButtons('#fullTableWrap');
  bindDeleteButtons('#fullTableWrap');
  renderListPagination(totalPages, list.length);
}

function renderListPagination(totalPages, totalItems){
  const wrap = $('#listPagination');
  if(!wrap) return;
  if(totalItems === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <button class="btn ghost" id="pagePrev" ${listPage<=1?'disabled':''}>${t('pagePrev')}</button>
    <span class="pagination-info">${t('pageInfo').replace('{page}', listPage).replace('{total}', totalPages)}</span>
    <button class="btn ghost" id="pageNext" ${listPage>=totalPages?'disabled':''}>${t('pageNext')}</button>
  `;
  $('#pagePrev').addEventListener('click', ()=>{ if(listPage>1){ listPage--; renderFullTable(); } });
  $('#pageNext').addEventListener('click', ()=>{ if(listPage<totalPages){ listPage++; renderFullTable(); } });

function populateFilterOptions(){
  const maps = [...new Set(rounds.map(r=>r.map).filter(Boolean))].sort();

// ---------- Round Report Card ----------
function avgStats(){
  const s = statsFor(rounds);
  return { avgMoney: s.avgMoney, avgXP: s.avgXP };
}

function rcDeltaLine(el, value, avg, overKey, underKey){
  if(!avg){
    el.textContent = '';
    return 0;
  }
  const delta = Math.round(((value - avg) / avg) * 100);
  el.classList.toggle('neg', delta < 0);
  const label = delta >= 0 ? t(overKey) : t(underKey);
  el.innerHTML = `<b>${delta >= 0 ? '+' : ''}${delta}%</b> ${label}`;
  return delta;
}

function rcCountUp(el, target, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased).toLocaleString(t('numberLocale'));
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function openRoundCard(round, opts){
  opts = opts || {};
  rcCurrentRound = round;

  const overlay = $('#rcOverlay');
  const card = $('#rcCard');

  $('#rcReportId').textContent = 'RUN-' + String(round.number).padStart(3, '0');
  $('#rcTimestamp').textContent = formatDate(round.date) + (round.time ? ' · ' + round.time : '');
  $('#rcMapName').textContent = round.map;
  $('#rcConditionValue').textContent = round.condition;

  const bannerImg = $('#rcBannerImg');
  bannerImg.style.display = '';
  bannerImg.src = mapImgSrc(round.map);

  const badge = $('#rcConditionBadge');
  badge.style.display = '';
  $('#rcConditionBadgeImg').src = conditionImgSrc(round.condition);

  const { avgMoney, avgXP } = avgStats();
  rcDeltaLine($('#rcDeltaMoney'), Number(round.money) || 0, avgMoney, 'rcDeltaMoneyOver', 'rcDeltaMoneyUnder');
  rcDeltaLine($('#rcDeltaXP'), Number(round.xp) || 0, avgXP, 'rcDeltaXPOver', 'rcDeltaXPUnder');

  const isTop = avgMoney > 0 && (Number(round.money) || 0) >= avgMoney * 1.2;
  card.classList.toggle('rc-top-run', isTop);

  if(opts.skipAnimation){
    $('#rcMoney').textContent = fmtXP(round.money);
    $('#rcXP').textContent = fmtXP(round.xp);
    overlay.classList.add('open');
    return;
  }

  $('#rcMoney').textContent = '0';
  $('#rcXP').textContent = '0';

  overlay.classList.remove('open');
  void card.offsetWidth; // reflow, damit die Animation bei erneutem Öffnen neu startet
  overlay.classList.add('open');

  setTimeout(() => {
    rcCountUp($('#rcMoney'), Number(round.money) || 0, 700);
    rcCountUp($('#rcXP'), Number(round.xp) || 0, 700);
  }, 550);
}

function closeRoundCard(){
  $('#rcOverlay').classList.remove('open');
  rcCurrentRound = null;
}

document.addEventListener('click', e=>{
  const row = e.target.closest('tbody tr[data-id]');
  if(row && !e.target.closest('td.actions')){
    const round = rounds.find(r => String(r.id) === String(row.dataset.id));

// ---------- Analysis ----------
function groupBy(list, keyFn){
  const map = new Map();
  list.forEach(r=>{
    const k = keyFn(r);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}
function statsFor(list){
  const count = list.length;
  const totalMoney = list.reduce((s,r)=>s+(Number(r.money)||0),0);
  const totalXP = list.reduce((s,r)=>s+(Number(r.xp)||0),0);
  return {
    count, totalMoney, totalXP,
    avgMoney: count? totalMoney/count : 0,
    avgXP: count? totalXP/count : 0
  };
}

    <div class="stat-card"><div class="label">${t('statAvgXP')}</div><div class="value teal">${fmtXP(Math.round(s.avgXP))}</div></div>

function topRounds(metric, n){
  return [...rounds]
    .sort((a,b)=> (Number(b[metric])||0) - (Number(a[metric])||0))
    .slice(0, n);
}

function renderHighscoreCard(metric, valueId, detailsId, listId, fmt){
  const top = topRounds(metric, 5);

  const detailsEl = document.getElementById(detailsId);

  if(top.length===0){

  const best = top[0];
  valueEl.textContent = fmt(best[metric]);
  detailsEl.textContent = `#${best.number} · ${best.map} · ${best.condition} · ${formatDate(best.date)}`;

  listEl.innerHTML = `
    <table>
      <tbody>
        ${top.map((r,i)=>`
          <tr>
            <td class="rank">${i+1}</td>
            <td>${fmt(r[metric])}</td>
            <td>${escapeHTML(r.map)}</td>
            <td>${formatDate(r.date)}</td>
          </tr>

function formatMonth(ym){
  const [y,m] = ym.split('-');
  return t('months')[Number(m)-1] + ' ' + y;
}

function drawBarChart(canvasId, labels, datasets){
  const ctx = document.getElementById(canvasId);
  if(charts[canvasId]) charts[canvasId].destroy();
  if(labels.length===0) return;
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: datasets.map(ds=>({
        label: ds.label,
        data: ds.data,
        backgroundColor: ds.bg,
        borderColor: ds.border,
        borderWidth: 1,
        borderRadius: 2,
        maxBarThickness: 23,
        yAxisID: ds.axis || 'y'
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: datasets.length > 1,
          labels: { color:'#8b949a', font:{family:'IBM Plex Mono', size:11}, boxWidth:12 }
        }
      },
      scales: {
        x: {
          ticks: { color:'#8b949a', font:{family:'IBM Plex Mono', size:11} },
          grid: { color:'rgba(255,255,255,0.04)' }
        },
        y: {
          position: 'left',
          ticks: { color:'rgba(232,163,61,0.9)', font:{family:'IBM Plex Mono', size:11} },
          grid: { color:'rgba(255,255,255,0.06)' }
        },
        y1: {
          position: 'right',
          ticks: { color:'rgba(92,139,143,0.9)', font:{family:'IBM Plex Mono', size:11} },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

// ---------- Distribution (pie charts) ----------
const PIE_COLORS = [
  'rgba(107, 122, 143, 0.75)',
  'rgba(247, 136, 47, 0.75)',
  'rgba(247, 195, 49, 0.75)',
  'rgba(220, 199, 170, 0.75)',
  'rgba(199, 175, 107, 0.75)',
  'rgba(172, 183, 174, 0.75)',
  'rgba(254, 218, 106, 0.75)',
  'rgba(58, 70, 96, 0.75)'
];

function drawPieChart(canvasId, labels, data){
  const ctx = document.getElementById(canvasId);
  if(charts[canvasId]) charts[canvasId].destroy();
  if(labels.length===0) return;
  charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: labels.map((_,i)=>PIE_COLORS[i % PIE_COLORS.length]),
        borderWidth: 0,
        borderRadius: 6,
        spacing: 4,
        hoverOffset: 10
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '62%',
      animation: { animateRotate: true, animateScale: true },
      plugins: {
        legend: {
          position: 'right',
          labels: { color:'#8b949a', font:{family:'IBM Plex Mono', size:11}, boxWidth:12, padding:10 }
        },
        tooltip: {
          callbacks: {
            label: ctx=>{
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const val = ctx.parsed;
              const pct = total? Math.round((val/total)*1000)/10 : 0;
              return `${ctx.label}: ${val} ${t('distRoundsSuffix')} (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function distTableHTML(entries, type){
  const total = entries.reduce((s,e)=>s+e.count,0);
  if(entries.length===0 || total===0){
    return '<div class="empty-state">' + t('emptyAnalysis') + '</div>';
  }
  const isOthers = key => key === t('distOthers');
  const rows = entries.map(e=>{
    const pct = Math.round((e.count/total)*1000)/10;
    let cell;
    if(isOthers(e.key)){
      cell = escapeHTML(e.key);
    } else if(type==='map'){
      cell = `<div class="cell-with-icon"><img class="map-thumb" src="${mapImgSrc(e.key)}" alt="" loading="lazy" onerror="this.remove()">${escapeHTML(e.key)}</div>`;
    } else {
      cell = `<div class="cell-with-icon"><img class="condition-thumb" src="${conditionImgSrc(e.key)}" alt="" loading="lazy" onerror="this.remove()">${escapeHTML(e.key)}</div>`;
    }
    return `
      <tr>
        <td>${cell}</td>
        <td>${e.count}</td>
        <td>${pct}%</td>
      </tr>
    `;
  }).join('');
  return `
    <table class="breakdown-table">
      <thead><tr><th></th><th>${t('thRounds')}</th><th>${t('thPercent')}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function topNWithOthers(entries, n){
  if(entries.length<=n) return entries;
  const top = entries.slice(0,n);
  const rest = entries.slice(n);
  const othersCount = rest.reduce((s,e)=>s+e.count,0);
  return [...top, { key: t('distOthers'), count: othersCount }];
}

function renderDistribution(){
  const mapGroups = groupBy(rounds, r=>r.map||'—');
  const mapEntries = [...mapGroups.entries()].map(([key,list])=>({key, count:list.length}))
    .sort((a,b)=>b.count-a.count);
  drawPieChart('chartMapDist', mapEntries.map(e=>e.key), mapEntries.map(e=>e.count));
  $('#tableMapDist').innerHTML = distTableHTML(mapEntries, 'map');

  const condGroups = groupBy(rounds, r=>r.condition||'—');
  const condEntriesAll = [...condGroups.entries()].map(([key,list])=>({key, count:list.length}))
    .sort((a,b)=>b.count-a.count);
  const condEntries = topNWithOthers(condEntriesAll, 5);
  drawPieChart('chartConditionDist', condEntries.map(e=>e.key), condEntries.map(e=>e.count));
  $('#tableConditionDist').innerHTML = distTableHTML(condEntries, 'condition');
}

// ---------- Global refresh ----------
function updateDatalists(){
  const conds = [...new Set(rounds.map(r=>r.condition).filter(Boolean))].sort();
  $('#conditionOptions').innerHTML = conds.map(c=>`<option value="${escapeHTML(c)}">`).join('');
}

function refreshAll(){
  const s = statsFor(rounds);
  $('#runCountVal').textContent = s.count;
  $('#totalMoneyVal').textContent = fmtMoney(s.totalMoney);
  $('#totalXPVal').textContent = fmtXP(s.totalXP);
  renderRecentTable();
  updateDatalists();
  if($('#view-list').classList.contains('active')) renderFullTable();
  if($('#view-analysis').classList.contains('active')) renderAnalysis();
  if($('#view-distribution').classList.contains('active')) renderDistribution();
  if($('#view-loot').classList.contains('active')) renderLoot();
}

// ---------- Init ----------
(async function init(){
  applyStaticTranslations();
  populateFilterOptions();
  prefillForm();
  renderTicker();
  try{
    await loadRounds();
    await loadLoot();
    setStatus('ok');
  }catch(err){
    setStatus('err');
  }
  try{
    await loadSettings();
  }catch(err){
    rankCatalog = [];
    currentRank = null;
  }
  renderProfile();
  refreshAll();
  loadSteamProfile();
})();
</script>
