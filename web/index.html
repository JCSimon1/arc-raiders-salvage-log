<script>
const API = '/api/rounds';
const LOOT_API = '/api/loot';
const SETTINGS_API = '/api/settings';
const CONFIG_API = '/api/config';
let rounds = [];
let loot = [];
let charts = {};
let editingId = null;
let lootSaveTimers = {};
let listPage = 1;
let listSort = { metric: null, dir: -1 }; 
let rankCatalog = [];
let currentRank = null;
let rcCurrentRound = null;

const $ = sel => document.querySelector(sel);

function applyIcons(root = document){
  root.querySelectorAll('[data-icon]').forEach(el => {
    el.outerHTML = icon(el.dataset.icon, el.dataset.iconClass || '');
  });
}

const FALLBACK_CONFIG = {
  ui: {
    defaultLanguage: null,
    listPageSize: 20,
    recentRows: 6,
    highscoreTopN: 10,
    distributionTopN: 5,
    topRunFactor: 1.2,
    deathMoneyThreshold: 0,
    tickerSeconds: 40
  },
  maps: [],
  companyLogos: [],
  badges: null,
  badgeRules: {},
  charts: { pieColors: ['rgba(247, 136, 47, 0.75)'] },
  steamConfigured: false
};

let CONFIG = FALLBACK_CONFIG;

async function loadConfig(){
  try{
    const res = await fetch(CONFIG_API);
    if(!res.ok) throw new Error('config load failed');
    const data = await res.json();
    CONFIG = {
      ...FALLBACK_CONFIG,
      ...data,
      ui: { ...FALLBACK_CONFIG.ui, ...(data.ui || {}) },
      charts: { ...FALLBACK_CONFIG.charts, ...(data.charts || {}) }
    };
  }catch(err){
    CONFIG = FALLBACK_CONFIG;
  }
}

const isDeath = r => Number(r.money) <= CONFIG.ui.deathMoneyThreshold;

let currentLang = localStorage.getItem('arclog-lang') || (navigator.language.startsWith('de') ? 'de' : 'en');

function t(key){ return translations[currentLang][key]; }
function fmtMoney(n){ return '$' + Number(n).toLocaleString(t('numberLocale')); }
function fmtXP(n){ return Number(n).toLocaleString(t('numberLocale')); }
function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(Date.UTC(Number(y), Number(m)-1, Number(d)));
  return dt.toLocaleDateString(t('dateLocale'), { timeZone:'UTC' });
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  $('#f-map').placeholder = t('placeholderMap');
  $('#f-condition').placeholder = t('placeholderCondition');
  document.documentElement.lang = currentLang;
  $('#langDE').classList.toggle('active', currentLang==='de');
  $('#langEN').classList.toggle('active', currentLang==='en');
  $('#entryPanelTitle').textContent = editingId ? t('editTitle') : t('entryTitle');
  $('#submitBtn').textContent = editingId ? t('updateBtn') : t('submitBtn');
  updateHsToggleLabels();
  updateRankSelectPlaceholder();
  updateRankCard();
  updateImportUI();
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('arclog-lang', lang);
  applyStaticTranslations();
  populateFilterOptions();
  refreshAll();
  if(lastSteamData) showSteamCard(lastSteamData);
  if(rcCurrentRound) openRoundCard(rcCurrentRound, { skipAnimation:true });
}
$('#langDE').addEventListener('click', ()=>setLang('de'));
$('#langEN').addEventListener('click', ()=>setLang('en'));

function setStatus(state){
  const dot = $('#statusDot');
  dot.classList.remove('ok','err');
  if(state) dot.classList.add(state);
}

function companyDisplayName(filename){
  return filename
    .replace(/\.webp$/i, '')
    .replace(/_Logo$/i, '')
    .replace(/_/g, ' ');
}

function renderTicker(){
  const track = $('#tickerTrack');
  const logos = CONFIG.companyLogos || [];
  if(!track || logos.length === 0) return;
  track.style.animationDuration = CONFIG.ui.tickerSeconds + 's';
  const itemHTML = logos.map(file => `
    <img src="/images/companies/${encodeURIComponent(file)}" alt="${escapeHTML(companyDisplayName(file))}"
         title="${escapeHTML(companyDisplayName(file))}" loading="lazy" onerror="this.remove()">
  `).join('');
  track.innerHTML = itemHTML + itemHTML;
}

function renderMapOptions(){
  const list = $('#mapOptions');
  if(!list) return;
  list.innerHTML = (CONFIG.maps || []).map(m=>`<option value="${escapeHTML(m)}">`).join('');
}

async function loadRounds(){
  const res = await fetch(API);
  if(!res.ok) throw new Error('load failed');
  rounds = await res.json();
}
async function createRound(entry){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      round_number: entry.number,
      round_date: entry.date,
      round_time: entry.time,
      map: entry.map,
      map_condition: entry.condition,
      money: entry.money,
      xp: entry.xp
    })
  });
  if(!res.ok) throw new Error('save failed');
  return res.json();
}
async function updateRound(id, entry){
  const res = await fetch(API + '/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      round_number: entry.number,
      round_date: entry.date,
      round_time: entry.time,
      map: entry.map,
      map_condition: entry.condition,
      money: entry.money,
      xp: entry.xp
    })
  });
  if(!res.ok) throw new Error('update failed');
  return res.json();
}
async function deleteRound(id){
  const res = await fetch(API + '/' + id, { method: 'DELETE' });
  if(!res.ok) throw new Error('delete failed');
}

async function loadLoot(){
  const res = await fetch(LOOT_API);
  if(!res.ok) throw new Error('loot load failed');
  loot = await res.json();
}
async function saveLootAmount(key, amount){
  const res = await fetch(LOOT_API + '/' + encodeURIComponent(key), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount })
  });
  if(!res.ok) throw new Error('loot save failed');
  return res.json();
}

function rankImgSrc(key){ return '/images/ranks/' + key + '.webp'; }

async function loadSettings(){
  const res = await fetch(SETTINGS_API);
  if(!res.ok) throw new Error('settings load failed');
  const data = await res.json();
  rankCatalog = data.ranks || [];
  currentRank = data.rank || null;
}

async function saveRank(rank){
  const res = await fetch(SETTINGS_API + '/rank', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rank: rank || null })
  });
  if(!res.ok) throw new Error('rank save failed');
  return res.json();
}

function updateRankSelectPlaceholder(){
  const placeholderOpt = $('#rankSelect') && $('#rankSelect').querySelector('option[value=""]');
  if(placeholderOpt) placeholderOpt.textContent = t('profileRankPlaceholder');
}

function populateRankSelect(){
  const select = $('#rankSelect');
  if(!select) return;
  select.innerHTML = `<option value="">${t('profileRankPlaceholder')}</option>` +
    rankCatalog.map(r => `<option value="${escapeHTML(r.key)}">${escapeHTML(r.name)}</option>`).join('');
  select.value = currentRank || '';
}

function rankName(key){
  const found = rankCatalog.find(r => r.key === key);
  return found ? found.name : null;
}

function updateRankLogo(){
  const img = $('#rankPreviewImg');
  if(img){
    if(currentRank){
      img.classList.remove('is-empty');
      img.src = rankImgSrc(currentRank);
    } else {
      img.classList.add('is-empty');
      img.removeAttribute('src');
    }
  }
  updateRankCard();
}

function updateRankCard(){
  const icon = $('#rankCardIcon');
  const value = $('#rankCardValue');
  if(!icon || !value) return;
  if(currentRank){

const STEAM_STATUS_CLASSES = [

];

function showSteamLoading(){

function showSteamCard(data){
  lastSteamData = data;
  const card = $('#steamCard');

  card.classList.remove('is-loading');  
  card.classList.remove('hidden');

  $('#steamName').textContent = data.name || '—';

  if(avatar){

      avatar.classList.remove('is-empty');

    }

  if(dot && text && statusRow){

async function loadSteamProfile(){
  if(!CONFIG.steamConfigured){ hideSteamCard(); return; }
  showSteamLoading();
  try{
    const res = await fetch('/api/steam/profile');
    if(!res.ok){ hideSteamCard(); return; }
    const data = await res.json();
    if(!data.configured || data.error){ hideSteamCard(); return; }
    showSteamCard(data);
  }catch(err){
    hideSteamCard();
  }
}

function sortedRounds(list){
  return [...list].sort((a,b)=>{
    const da = a.date+ 'T'+(a.time||'00:00');
    const db = b.date+ 'T'+(b.time||'00:00');
    if(da!==db) return db.localeCompare(da);
    return (b.number||0)-(a.number||0);
  });
}

function sortTh(metric, label){
  const active = listSort.metric === metric;
  const arrow = active ? (listSort.dir === 1 ? '▲' : '▼') : '↕';
  const aria = active ? (listSort.dir === 1 ? 'ascending' : 'descending') : 'none';
  return `<th class="center" aria-sort="${aria}"><button type="button" class="th-sort${active ? ' active' : ''}" data-sort="${metric}">${label}<span class="th-sort-arrow">${arrow}</span></button></th>`;
}

function tableHTML(list, opts){
  opts = opts || {};
  const sortable = opts.sortable === true;
  const editable = opts.editable !== false;
  if(list.length===0){
    return '<div class="empty-state">' + t('emptyState') + '</div>';
  }
  const rows = list.map(r=>`
    <tr data-id="${r.id}" class="rc-row-trigger">
      <td>${r.number}</td>
      <td>${formatDate(r.date)}</td>
      <td>${r.time||''}</td>
      <td><div class="cell-with-icon">${mapThumbHTML(r)}${escapeHTML(r.map)}</div></td>
      <td><div class="cell-with-icon"><img class="condition-thumb" src="${conditionImgSrc(r.condition)}" alt="" loading="lazy" onerror="this.remove()">${escapeHTML(r.condition)}</div></td>
      <td class="money">${fmtMoney(r.money)}</td>
      <td class="xp">${fmtXP(r.xp)}</td>
      ${editable? `<td class="actions"><button class="edit" data-id="${r.id}">${t('edit')}</button><button class="del" data-id="${r.id}" title="${t('deleteHoldHint')}"><span>${t('delete')}</span></button></td>`:''}
    </tr>
  `).join('');
  return `
    <table>
      <thead><tr>
        <th>${t('thNumber')}</th><th>${t('thDate')}</th><th>${t('thTime')}</th><th>${t('thMap')}</th><th>${t('thCondition')}</th>${sortable ? sortTh('money', t('thMoney')) : `<th class="center">${t('thMoney')}</th>`}${sortable ? sortTh('xp', t('thXP')) : `<th class="center">${t('thXP')}</th>`}${editable?'<th></th>':''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function slugify(s){

    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') 
    .replace(/[^a-z0-9]/g, '');
}

function renderFullTable(){
  populateFilterOptions();
  const mapF = $('#filterMap').value;
  const condF = $('#filterCondition').value;
  const monthF = $('#filterMonth').value;
  let list = rounds.filter(r=>{
    if(mapF && r.map!==mapF) return false;
    if(condF && r.condition!==condF) return false;
    if(monthF && r.date && r.date.slice(0,7)!==monthF) return false;
    return true;
  });
  list = sortedRounds(list); 
  if(listSort.metric){
    list.sort((a, b) => listSort.dir * ((Number(a[listSort.metric]) || 0) - (Number(b[listSort.metric]) || 0)));
  }

  const pageSize = CONFIG.ui.listPageSize;
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  if(listPage > totalPages) listPage = totalPages;
  if(listPage < 1) listPage = 1;
  const start = (listPage - 1) * pageSize;
  const pageItems = list.slice(start, start + pageSize);

  $('#fullTableWrap').innerHTML = tableHTML(pageItems, { sortable: true });

  wrap.innerHTML = `

    <button class="btn ghost" id="pageNext" ${listPage>=totalPages?'disabled':''}>${t('pageNext')}</button>

const HOLD_MS = 1000;

function bindDeleteButtons(scopeSel){
  document.querySelectorAll(scopeSel+' .del').forEach(btn=>{
    let timer = null;

    const cancel = ()=>{
      clearTimeout(timer);
      timer = null;
      btn.classList.remove('holding');
    };

    const start = (e)=>{
      if(e.button !== undefined && e.button !== 0) return;
      e.stopPropagation();
      btn.classList.add('holding');
      timer = setTimeout(async ()=>{
        timer = null;
        try{
          await deleteRound(btn.dataset.id);
          if(editingId && String(editingId)===String(btn.dataset.id)) exitEditMode();
          await loadRounds();
          setStatus('ok');
          refreshAll();
        }catch(err){
          btn.classList.remove('holding');
          setStatus('err');
        }
      }, HOLD_MS);
    };

    btn.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    btn.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, cancel));
    btn.addEventListener('click', e => e.stopPropagation());
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if((e.key===' '||e.key==='Enter') && !e.repeat) start(e); });
    btn.addEventListener('keyup', e => { if(e.key===' '||e.key==='Enter') cancel(); });
  });
}

function rcDeltaLine(el, value, avg, overKey, underKey){
  if(!avg){
    el.textContent = '';
    return 0;
  }
  const delta = Math.round(((value - avg) / avg) * 100);
  el.classList.toggle('neg', delta < 0);
  const label = delta >= 0 ? t(overKey) : t(underKey);
  el.innerHTML = `<b>${delta >= 0 ? '+' : ''}${delta}%</b> ${label}`;
  return delta;
}

function rcCountUp(el, target, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased).toLocaleString(t('numberLocale'));
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

  const { avgMoney, avgXP } = avgStats();

  rcDeltaLine($('#rcDeltaXP'), Number(round.xp) || 0, avgXP, 'rcDeltaXPOver', 'rcDeltaXPUnder');

  const isTop = avgMoney > 0 && (Number(round.money) || 0) >= avgMoney * CONFIG.ui.topRunFactor;

  overlay.classList.add('open');

function groupBy(list, keyFn){
  const map = new Map();
  list.forEach(r=>{
    const k = keyFn(r);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}
function statsFor(list){
  const count = list.length;
  const totalMoney = list.reduce((s,r)=>s+(Number(r.money)||0),0);
  const totalXP = list.reduce((s,r)=>s+(Number(r.xp)||0),0);
  const deaths = list.filter(isDeath).length;
  return {
    count, totalMoney, totalXP, deaths,
    avgMoney: count? totalMoney/count : 0,
    avgXP: count? totalXP/count : 0
  };
}

function renderHighscoreCard(metric, valueId, detailsId, listId, fmt, bgId){

  const valueEl = document.getElementById(valueId);
  const detailsEl = document.getElementById(detailsId);
  const listEl = document.getElementById(listId);
  const bgEl = bgId ? document.getElementById(bgId) : null;

function dateKey(dt){
  return dt.getFullYear() + '-' +
    String(dt.getMonth()+1).padStart(2,'0') + '-' +
    String(dt.getDate()).padStart(2,'0');
}

function periodRange(kind, ref){
  const y = ref.getFullYear(), m = ref.getMonth(), d = ref.getDate();
  if(kind === 'month'){
    return [dateKey(new Date(y, m, 1)), dateKey(new Date(y, m+1, 1))];
  }
  const dow = (ref.getDay() + 6) % 7; 
  return [dateKey(new Date(y, m, d - dow)), dateKey(new Date(y, m, d - dow + 7))];
}

function periodStartKey(kind, dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return periodRange(kind, new Date(y, m-1, d))[0];
}

function badgeMin(cfg, kind, fallback){
  const m = cfg.minRounds;
  if(m !== null && typeof m === 'object') return Number(m[kind]) || fallback;
  return m == null ? fallback : Number(m);
}

function computeBadges(kind, ref){
  const rulesCfg = CONFIG.badgeRules || {};
  const [startKey, endKey] = periodRange(kind, ref || new Date());
  const inPeriod = rounds.filter(r => r.date && r.date >= startKey && r.date < endKey);
  if(inPeriod.length === 0) return [];

  const cur = statsFor(inPeriod);
  const all = statsFor(rounds);

  const rules = {
    record(){
      const best = [topRounds('money', 1)[0], topRounds('xp', 1)[0]];
      return best.some(r => r && (Number(r.money) > 0 || Number(r.xp) > 0) &&
        inPeriod.some(p => p.id === r.id)) ? {} : null;
    },
    deathless(cfg){
      const n = badgeMin(cfg, kind, 3);
      return cur.count >= n && cur.deaths === 0 ? { n } : null;
    },
    grinder(cfg){
      const n = badgeMin(cfg, kind, 10);
      return cur.count >= n ? { n } : null;
    },
    aboveAvg(cfg){
      const n = badgeMin(cfg, kind, 3);
      const metrics = cfg.metrics || ['money', 'xp'];
      const ok = (metrics.includes('money') && cur.avgMoney > all.avgMoney) ||
                 (metrics.includes('xp') && cur.avgXP > all.avgXP);
      return cur.count >= n && ok ? { n } : null;
    },
    best(cfg){
      const groups = groupBy(rounds.filter(r => r.date), r => periodStartKey(kind, r.date));
      if(groups.size < (cfg.minPeriods || 2) || cur.totalMoney <= 0) return null;
      const maxTotal = Math.max(...[...groups.values()].map(l => statsFor(l).totalMoney));
      return cur.totalMoney >= maxTotal ? {} : null;
    }
  };

  return Object.keys(rulesCfg).flatMap(key => {
    const cfg = rulesCfg[key];
    if(!cfg || cfg.enabled === false || !rules[key]) return [];
    if(cfg.periods && !cfg.periods.includes(kind)) return [];
    const result = rules[key](cfg);
    return result ? [{ key, n: result.n }] : [];
  });
}

function renderBadgeList(elId, kind){
  const el = document.getElementById(elId);
  if(!el) return;
  const badges = computeBadges(kind);
  if(badges.length === 0){
    el.innerHTML = `<span class="badge-none">${t('badgeNone')}</span>`;
    return;
  }
  el.innerHTML = badges.map(({key, n}) => {
    const tip = t('badgeTip_' + key).replace('{n}', n ?? '');
    return `<span class="badge-chip" title="${escapeHTML(tip)}">

    </span>`;
  }).join('');
}

let soundEnabled = localStorage.getItem('arclog-sound') !== 'off';
let soundVolume = Number(localStorage.getItem('arclog-sound-vol') ?? 0.4);
let audioCtx = null;
let lastTick = 0;
const canHover = window.matchMedia('(hover: hover)').matches;

function unlockAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
['pointerdown','keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once:false, passive:true })
);

function playTick(){
  if(!soundEnabled || soundVolume <= 0 || !audioCtx || audioCtx.state !== 'running') return;
  const nowMs = performance.now();
  if(nowMs - lastTick < 50) return;  
  lastTick = nowMs;

  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1800, t0);
  osc.frequency.exponentialRampToValueAtTime(900, t0 + 0.04);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.06 * soundVolume), t0 + 0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.06);
}
function soundReady(){
  return soundEnabled && soundVolume > 0 && audioCtx && audioCtx.state === 'running';
}

let noiseBuf = null;
function getNoiseBuffer(){
  if(!noiseBuf){
    const len = Math.floor(audioCtx.sampleRate * 0.7);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function playSwoosh(){
  if(!soundReady()) return;
  const t0 = audioCtx.currentTime;
  const dur = 0.55;

  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 1.1;
  filter.frequency.setValueAtTime(250, t0);
  filter.frequency.exponentialRampToValueAtTime(3600, t0 + dur * 0.55);
  filter.frequency.exponentialRampToValueAtTime(1000, t0 + dur);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.35 * soundVolume), t0 + dur * 0.35);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}

function playCountUp(durationMs){
  if(!soundReady()) return;
  const t0 = audioCtx.currentTime;
  const dur = durationMs / 1000;
  const steps = 14;
  const peak = Math.max(0.0001, 0.05 * soundVolume);

  for(let i = 0; i < steps; i++){
    const p = i / steps;
    const at = t0 + dur * (1 - Math.pow(1 - p, 1 / 3));
    const freq = 600 + 900 * p;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak, at + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.035);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(at);
    osc.stop(at + 0.045);
  }

  const end = t0 + dur;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(2000, end);
  gain.gain.setValueAtTime(0.0001, end);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.08 * soundVolume), end + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, end + 0.25);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(end);
  osc.stop(end + 0.3);
}

const CSV_HEADERS = {
  number:    ['#', 'nr', 'nr.', 'no', 'no.', 'number', 'nummer'],
  date:      ['date', 'datum'],
  time:      ['time', 'zeit', 'uhrzeit'],
  map:       ['map'],

};
// Schreibweisen aus der eigenen Tabelle → Name in der App (Kleinbuchstaben als Schlüssel)

const CONDITION_ALIASES = { None: 'Clear' };

function parseCsv(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = [];
  let row = [], cell = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i + 1] === '"'){ cell += '"'; i++; } else inQ = false;
      } else cell += c;
    } else if(c === '"') inQ = true;
    else if(c === sep){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function csvDate(v){
  v = v.trim();
  const m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : v;
}
function csvTime(v){
  v = v.trim();
  const m = v.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  return m ? m[1].padStart(2, '0') + ':' + m[2] : v;
}
function csvInt(v){
  let s = String(v).trim().replace(/[$\s]/g, '');
  if(/^-?\d{1,3}([.,']\d{3})+$/.test(s)) s = s.replace(/[.,']/g, '');   // Tausendertrenner
  const n = Number(s);
  return s !== '' && Number.isFinite(n) ? n : 'invalid';   // der Server zählt das als ungültig
}
function csvMap(v){
  const name = v.trim();
  const key = name.toLowerCase();
  return (CONFIG.maps || []).find(m => m.toLowerCase() === key) || MAP_ALIASES[key] || name;
}

function csvCondition(v){
  const name = v.trim();
  return CONDITION_ALIASES[name.toLowerCase()] || name;
}

function csvToPayload(text){
  const rows = parseCsv(text);
  if(rows.length === 0) throw new Error(t('importCsvEmpty'));

  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {};
  for(const [field, names] of Object.entries(CSV_HEADERS)){
    idx[field] = header.findIndex(h => names.includes(h));
    if(idx[field] < 0) throw new Error(tpl(t('importCsvHeaders'), { col: names[0] }));
  }

  const cell = (r, field) => (r[idx[field]] ?? '');
  const rounds = rows.slice(1).map(r => ({
    number: csvInt(cell(r, 'number')),
    date: csvDate(cell(r, 'date')),
    time: csvTime(cell(r, 'time')),
    map: csvMap(cell(r, 'map')),
    condition: csvCondition(cell(r, 'condition')),
    money: csvInt(cell(r, 'money')),
    xp: csvInt(cell(r, 'xp'))
  }));

  const known = new Set((CONFIG.maps || []).map(m => m.toLowerCase()));
  const unknown = [...new Set(rounds.map(r => r.map).filter(m => m && !known.has(m.toLowerCase())))];
  const notes = unknown.length ? [tpl(t('importNoteMaps'), { maps: unknown.join(', ') })] : [];

  return { payload: { app: 'arc-log', schemaVersion: 1, rounds }, notes };
}

function importMode(){
  return document.querySelector('input[name="importMode"]:checked').value;
}

function showImportMsg(text, kind){
  const msg = $('#importMsg');
  msg.textContent = text;
  msg.classList.remove('ok','err');
  msg.classList.add(kind, 'show');
  setTimeout(()=>msg.classList.remove('show'), 4000);
}

async function postImport(dryRun){
  const res = await fetch(`/api/import?mode=${importMode()}&dryRun=${dryRun ? 1 : 0}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(importPayload)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || t('importError'));
  return data;
}

function renderImportPreview(){
  const el = $('#importPreview');
  const p = importPreview;
  if(!p){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  const vars = { new: fmtXP(p.inserted), dup: fmtXP(p.duplicates), del: fmtXP(p.deleted), invalid: fmtXP(p.invalid) };
  const lines = [ tpl(t(p.mode === 'replace' ? 'importPreviewReplace' : 'importPreviewMerge'), vars) ];
  if(p.lootUpdated != null) lines.push(tpl(t('importPreviewLoot'), { n: p.lootUpdated }));
  if(p.rankApplied) lines.push(t('importPreviewRank'));
  if(p.errors.length) lines.push(tpl(t('importPreviewInvalidRows'), { rows: p.errors.join(', ') }));
  importNotes.forEach(n => lines.push(n));
  el.innerHTML = lines.map(l => `<div>${escapeHTML(l)}</div>`).join('');
  el.classList.remove('hidden');
}

function updateImportUI(){
  const replace = importMode() === 'replace';
  const word = t('importConfirmWord');
  $('#importBtn').textContent = t(replace ? 'importBtnReplace' : 'importBtnMerge');
  $('#importConfirmLabel').textContent = tpl(t('importConfirmLabel'), { word });
  $('#importConfirmRow').classList.toggle('hidden', !(replace && importPreview));
  const confirmed = !replace || $('#importConfirm').value.trim() === word;
  $('#importBtn').disabled = !importPreview || !confirmed || importBusy;
  renderImportPreview();
}

async function refreshImportPreview(){
  importPreview = null;
  $('#importConfirm').value = '';
  if(importPayload){
    try{
      importPreview = await postImport(true);
    }catch(err){
      showImportMsg(err.message, 'err');
    }
  }
  updateImportUI();
}

$('#importFile').addEventListener('change', async e => {
  importPayload = null;
  importNotes = [];
  const file = e.target.files[0];
  if(file){
    try{
      const text = await file.text();
      if(/\.csv$/i.test(file.name)){
        const r = csvToPayload(text);
        importPayload = r.payload;
        importNotes = r.notes;
      } else {
        importPayload = JSON.parse(text);
      }
    }catch(err){
      showImportMsg(err instanceof SyntaxError ? t('importInvalidFile') : err.message, 'err');
    }
  }
  await refreshImportPreview();
});

document.querySelectorAll('input[name="importMode"]').forEach(r =>
  r.addEventListener('change', refreshImportPreview));
$('#importConfirm').addEventListener('input', updateImportUI);

$('#importBtn').addEventListener('click', async () => {
  importBusy = true;
  updateImportUI();
  try{
    const result = await postImport(false);
    await Promise.all([loadRounds(), loadLoot(), loadSettings()]);
    renderProfile();
    exitEditMode();
    refreshAll();
    setStatus('ok');
    importPayload = null;
    importPreview = null;
    importNotes = []; 
    $('#importFile').value = '';
    $('#importConfirm').value = '';
    showImportMsg(tpl(t('importDone'), { n: fmtXP(result.inserted) }), 'ok');
  }catch(err){
    showImportMsg(err.message, 'err');
    setStatus('err');
  }finally{
    importBusy = false;
    updateImportUI();
  }
});

(async function init(){
  applyIcons();
  await loadConfig();
  if(!localStorage.getItem('arclog-lang') && CONFIG.ui.defaultLanguage){
    currentLang = CONFIG.ui.defaultLanguage;
  }
  applyStaticTranslations();
  loadSteamProfile();
  renderMapOptions();
  populateFilterOptions();
  prefillForm();
  renderTicker();
  try{
    await loadRounds();
    await loadLoot();
    setStatus('ok');
  }catch(err){
    setStatus('err');
  }
  try{
    await loadSettings();
  }catch(err){
    rankCatalog = [];
    currentRank = null;
  }
  renderProfile();
  refreshAll();
})();
</script>
</body>
